<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Compras</title>
<style>
:root{
  --bg:#f4f5f7;--panel:#fff;--text:#20242a;--muted:#737b86;--line:#e4e7eb;
  --primary:#24272d;--accent:#6f63ff;--green:#15966a;--orange:#d88700;--red:#c94a4a;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
aside{width:235px;background:#202228;color:white;padding:22px 16px;position:sticky;top:0;height:100vh}
.brand{margin:0 8px 25px;height:74px;display:flex;align-items:center}.brand img{max-width:185px;max-height:68px;width:auto;height:auto;object-fit:contain}
.brand span{color:#a69fff}
.nav button{width:100%;border:0;background:transparent;color:#d9dbe0;text-align:left;padding:12px 13px;border-radius:9px;margin:3px 0}
.nav button:hover,.nav button.active{background:#33363e;color:white}
.nav .icon{display:inline-block;width:24px}
main{flex:1;padding:26px;max-width:1500px;margin:auto;width:100%}
.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}
h1{font-size:28px;margin:0 0 5px}.subtitle{color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 14px}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.accent{background:var(--accent);color:white;border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px}
.card .num{font-size:27px;font-weight:800}.card .lbl{font-size:13px;color:var(--muted);margin-top:4px}
.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.panel-title h2{font-size:17px;margin:0}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:9px;margin-bottom:14px}
input,select{width:100%;border:1px solid var(--line);background:white;border-radius:8px;padding:10px 11px;color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;background:#f7f7f8;color:#626a75;font-weight:700}
th,td{padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700}
.b-green{background:#e5f6ef;color:var(--green)}.b-orange{background:#fff2dc;color:var(--orange)}.b-red{background:#fde8e8;color:var(--red)}.b-gray{background:#eef0f3;color:#626a75}
.link{border:0;background:none;color:#5e55dc;padding:0;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:28px}
.hidden{display:none!important}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal{background:white;border-radius:14px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:22px}
.modal h2{margin-top:0}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#555d67}
.field.full{grid-column:1/-1}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.small{font-size:12px;color:var(--muted)}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}
.item-box{border:1px solid var(--line);border-radius:10px;padding:13px;margin:10px 0;background:#fafafa}.quote{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px;margin:8px 0}.quote-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:8px;align-items:end}.doc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:6px 0}.doc-name{font-weight:700;font-size:13px}.doc-meta{font-size:11px;color:var(--muted)}
.item-row{display:grid;grid-template-columns:2fr .7fr .7fr 1.2fr 1fr;gap:8px;align-items:center}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media(max-width:900px){aside{width:190px}.cards{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}.item-row{grid-template-columns:1fr 1fr}}
@media(max-width:650px){aside{display:none}main{padding:15px}.cards{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}

.computo-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.computo-kpi{background:#f7f8fa;border:1px solid var(--line);border-radius:12px;padding:12px}
.computo-kpi b{display:block;font-size:20px;margin-bottom:3px}
.computo-table-wrap{overflow:auto;max-height:58vh;border:1px solid var(--line);border-radius:12px}
.computo-table-wrap table{margin:0;min-width:780px}
.file-row{display:grid;grid-template-columns:1.7fr 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:10px;margin-top:8px}
@media(max-width:850px){.computo-summary{grid-template-columns:repeat(2,1fr)}.file-row{grid-template-columns:1fr}}

.search-modal{max-width:760px!important}
.search-box{display:flex;gap:8px;align-items:center;margin:14px 0}
.search-box input{flex:1;font-size:16px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;outline:none}
.search-box input:focus{border-color:var(--primary)}
.search-results{max-height:60vh;overflow:auto}
.search-result{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line)}
.search-result:last-child{border-bottom:0}
.search-result-main{min-width:0}
.search-result-title{font-weight:700}
.search-result-meta{font-size:12px;color:var(--muted);margin-top:3px}
.search-result .btn{white-space:nowrap}
.search-empty{padding:28px 10px;text-align:center;color:var(--muted)}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const KEY='compras_app_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{obras:[],proveedores:[],pedidos:[],items:[],documents:[]};
if(!db.obras)db.obras=[];if(!db.proveedores)db.proveedores=[];if(!db.pedidos)db.pedidos=[];if(!db.items)db.items=[];if(!db.documents)db.documents=[];
let currentView='dashboard';

function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function uid(prefix='id'){return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(n){return '$ '+Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:2})}
function statusItem(i){
  if((i.recibido||0)>=Number(i.cantidad||0)) return ['Completo','b-green'];
  if(i.estadoCompra==='aceptado' && (i.recibido||0)===0) return ['Pendiente de llegada','b-orange'];
  if((i.recibido||0)>0) return ['Parcial','b-orange'];
  if(i.estadoCompra==='rechazado') return ['Rechazado','b-red'];
  if(i.cotizaciones && i.cotizaciones.length) return ['Cotizando','b-orange'];
  if(i.proveedor) return ['Proveedor asignado','b-orange'];
  return ['Sin cotizar','b-gray'];
}
function totals(){
 const items=db.items;
 return {items:items.length,complete:items.filter(i=>(i.recibido||0)>=Number(i.cantidad||0)).length,
 partial:items.filter(i=>(i.recibido||0)>0&&(i.recibido||0)<Number(i.cantidad||0)).length,
 pending:items.filter(i=>(i.recibido||0)<Number(i.cantidad||0)).length};
}
function showView(v,btn){
 currentView=v;
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
 if(btn)btn.classList.add('active');
 render();
}

function openQuickSearch(){
  document.getElementById('modalRoot').innerHTML=`
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal search-modal">
        <div class="detail-head">
          <div>
            <h2>🔎 Buscar</h2>
            <div class="small">Buscá por artículo, proveedor, pedido u obra</div>
          </div>
          <button class="btn" onclick="closeModal()">Cerrar</button>
        </div>

        <div class="search-box">
          <input id="quickSearchInput"
                 type="search"
                 placeholder="Ej.: caño 1&quot;, proveedor, pedido 8, UP13..."
                 oninput="runQuickSearch()"
                 autocomplete="off">
        </div>

        <div id="quickSearchResults" class="search-results">
          <div class="search-empty">Escribí algo para comenzar a buscar.</div>
        </div>
      </div>
    </div>`;

  setTimeout(()=>{
    const el=document.getElementById('quickSearchInput');
    if(el)el.focus();
  },50);
}

function runQuickSearch(){
  const input=document.getElementById('quickSearchInput');
  const box=document.getElementById('quickSearchResults');
  if(!input||!box)return;

  const q=input.value.trim().toLowerCase();

  if(!q){
    box.innerHTML='<div class="search-empty">Escribí algo para comenzar a buscar.</div>';
    return;
  }

  const results=[];
  const seen=new Set();

  // Obras
  db.obras.forEach(o=>{
    const text=[o.nombre,o.cliente,o.direccion].join(' ').toLowerCase();
    if(text.includes(q)){
      const key='obra_'+o.id;
      if(!seen.has(key)){
        seen.add(key);
        results.push({
          type:'obra',
          title:o.nombre||'Obra sin nombre',
          meta:'🏗️ Obra'+(o.cliente?' · '+o.cliente:''),
          action:`openObraDetail('${o.id}')`
        });
      }
    }
  });

  // Pedidos
  db.pedidos.forEach(p=>{
    const o=db.obras.find(x=>x.id===p.obraId);
    const text=[p.numero,p.fecha,o?.nombre].join(' ').toLowerCase();
    if(text.includes(q)){
      const key='pedido_'+p.id;
      if(!seen.has(key)){
        seen.add(key);
        const count=db.items.filter(i=>i.pedidoId===p.id).length;
        results.push({
          type:'pedido',
          title:'Pedido '+(p.numero??''),
          meta:'📦 '+(o?.nombre||'Sin obra')+' · '+count+' artículos',
          action:`openOrderDetail('${p.id}')`
        });
      }
    }
  });

  // Materiales / proveedores
  db.items.forEach(i=>{
    const p=db.pedidos.find(x=>x.id===i.pedidoId);
    const o=db.obras.find(x=>x.id===p?.obraId);
    const text=[
      i.articulo,
      i.proveedor,
      i.unidad,
      p?.numero,
      o?.nombre
    ].join(' ').toLowerCase();

    if(text.includes(q)){
      const key='item_'+i.id;
      if(!seen.has(key)){
        seen.add(key);
        results.push({
          type:'item',
          title:i.articulo||'Artículo sin nombre',
          meta:'📦 Pedido '+(p?.numero??'—')+' · '+(o?.nombre||'Sin obra')+
               (i.proveedor?' · '+i.proveedor:''),
          action:`openOrderDetail('${p?.id||''}')`
        });
      }
    }
  });

  results.splice(30);

  if(!results.length){
    box.innerHTML='<div class="search-empty">No encontré resultados para <b>'+esc(input.value)+'</b>.</div>';
    return;
  }

  box.innerHTML=results.map(r=>`
    <div class="search-result">
      <div class="search-result-main">
        <div class="search-result-title">${esc(r.title)}</div>
        <div class="search-result-meta">${esc(r.meta)}</div>
      </div>
      <button class="btn" onclick="${r.action}">Abrir →</button>
    </div>
  `).join('');
}

function obraComputo(o){return o&&o.computo&&Array.isArray(o.computo.materiales)?o.computo:{materiales:[],reemplazos:[],rubros:[],archivos:[]}}
function normalizeMaterialJS(s){
 s=String(s||'').replace(/\r?\n/g,' ').replace(/\s+/g,' ').trim().toUpperCase();
 s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 s=s.replace(/H°G°/g,'HG').replace(/HºGº/g,'HG').replace(/Ø/g,'D');
 s=s.replace(/\bCAJAS\b/g,'CAJA').replace(/\bUNIONES\b/g,'UNION');
 return s;
}
function purchasedForComputo(o,mat){
 const ps=db.pedidos.filter(p=>p.obraId===o.id).map(p=>p.id);
 return db.items.filter(i=>ps.includes(i.pedidoId)&&normalizeMaterialJS(i.articulo)===normalizeMaterialJS(mat.articulo)&&normalizeMaterialJS(i.unidad||'')===normalizeMaterialJS(mat.unidad||'')).reduce((s,i)=>s+Number(i.cantidad||0),0);
}
function computoEstado(o,m){
 const c=Number(m.cantidadComputada||0),p=purchasedForComputo(o,m);
 if(p>c)return ['Excede','b-red'];
 if(p===c&&c>0)return ['Completo','b-green'];
 if(p>0)return ['En compra','b-orange'];
 return ['Sin comprar','b-gray'];
}

function addQuickQuote(itemId){
 const i=db.items.find(x=>x.id===itemId); if(!i)return;
 i.cotizaciones=i.cotizaciones||[];
 i.cotizaciones.push({id:uid('quote'),proveedor:'',precio:0,estado:'pendiente'});
 openOrderDetail(i.pedidoId);
}

function removeQuickQuote(itemId,idx){
 const i=db.items.find(x=>x.id===itemId); if(!i)return;
 i.cotizaciones=i.cotizaciones||[];
 i.cotizaciones.splice(idx,1);
 openOrderDetail(i.pedidoId);
}

function saveWholeOrder(orderId){
 const items=db.items.filter(i=>i.pedidoId===orderId);

 for(const i of items){
  const prov=(document.getElementById('editProv_'+i.id)?.value||'').trim();
  const price=Number(document.getElementById('editPrice_'+i.id)?.value||0);
  const qty=Number(document.getElementById('editQty_'+i.id)?.value||0);
  const received=Number(document.getElementById('editReceived_'+i.id)?.value||0);

  if(qty<0 || received<0){
   alert('Las cantidades no pueden ser negativas.');
   return;
  }

  if(received>qty){
   alert('El material "'+i.articulo+'" tiene más cantidad recibida que pedida.');
   return;
  }

  i.cantidad=qty;
  i.recibido=received;

  // Leer todas las cotizaciones directamente desde esta pantalla.
  i.cotizaciones=i.cotizaciones||[];

  // Si todavía no había ninguna, la primera fila visible se guarda como nueva cotización.
  if(i.cotizaciones.length===0){
   const pEl=document.getElementById(`qqProv_${i.id}_0`);
   const prEl=document.getElementById(`qqPrice_${i.id}_0`);
   const stEl=document.getElementById(`qqState_${i.id}_0`);
   const proveedor=(pEl?.value||'').trim();
   if(proveedor){
    i.cotizaciones.push({
     id:uid('quote'),
     proveedor,
     precio:Number(prEl?.value||0),
     estado:stEl?.value||'pendiente'
    });
   }
  }else{
   i.cotizaciones.forEach((q,idx)=>{
    const pEl=document.getElementById(`qqProv_${i.id}_${idx}`);
    const prEl=document.getElementById(`qqPrice_${i.id}_${idx}`);
    const stEl=document.getElementById(`qqState_${i.id}_${idx}`);
    if(pEl)q.proveedor=(pEl.value||'').trim();
    if(prEl)q.precio=Number(prEl.value||0);
    if(stEl)q.estado=stEl.value;
   });
  }

  // Limpiar cotizaciones vacías.
  i.cotizaciones=i.cotizaciones.filter(q=>q.proveedor);

  const accepted=i.cotizaciones.find(q=>q.estado==='aceptada');

  if(accepted){
   i.proveedor=accepted.proveedor;
   i.precioAceptado=Number(accepted.precio||0);
   i.estadoCompra='aceptado';

   // Solo puede haber una cotización aceptada.
   i.cotizaciones.forEach(q=>{
    if(q!==accepted)q.estado='rechazada';
   });
  }else{
   // Si el usuario cargó proveedor/precio manualmente pero no aceptó
   // ninguna cotización, no lo marcamos como compra confirmada.
   i.proveedor='';
   i.precioAceptado=0;

   if(i.cotizaciones.length){
    i.estadoCompra=i.cotizaciones.some(q=>q.estado==='pendiente')
      ? 'pendiente'
      : 'rechazado';
   }else{
    i.estadoCompra='pendiente';
   }
  }
 }

 save();
 alert('Pedido guardado correctamente.');
 openOrderDetail(orderId);
}

 if(el) el.textContent=pending;
 if(rec) rec.textContent=received;
}

function xlsxNum(v){
 if(typeof v==='number'&&isFinite(v))return v;
 if(v===null||v===undefined||v==='')return 0;
 let s=String(v).replace(/\./g,'').replace(',','.');
 const n=Number(s);return isFinite(n)?n:0;
}
function normalizeImportMaterial(s){
 let x=String(s||'').replace(/\r?\n/g,' ').replace(/\s+/g,' ').trim().toUpperCase();
 x=x.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 x=x.replace(/H°G°/g,'HG').replace(/HºGº/g,'HG').replace(/Ø/g,'D');
 x=x.replace(/\bCAJAS\b/g,'CAJA').replace(/\bUNIONES\b/g,'UNION');
 return x;
}
function extractXlsxRecords(wb,rubro,fileName){
 const base=[],add=[],repl=[];
 wb.SheetNames.forEach(sn=>{
   if(!/^\d/.test(String(sn)) && String(sn).trim().toUpperCase()!=='ADICIONALES')return;
   const ws=wb.Sheets[sn],rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
   let obraCount=0,end=rows.length;
   for(let r=0;r<rows.length;r++){const b=String(rows[r]?.[1]??'').trim().toUpperCase();if(b.startsWith('OBRA:')){obraCount++;if(obraCount===2){end=r;break}}}
   let mode='add', isAdd=String(sn).trim().toUpperCase()==='ADICIONALES';
   for(let r=0;r<end;r++){
     const row=rows[r]||[],desc=String(row[1]??'').replace(/\r?\n/g,' ').replace(/\s+/g,' ').trim(),unit=String(row[2]??'').trim(),qty=xlsxNum(row[3]);
     if(!desc||!unit||qty<=0)continue;
     const up=desc.toUpperCase();
     if(isAdd){
       if(up.includes('REMPLAZA A')||up.includes('REEMPLAZA A')){mode='replace';continue}
       if(up.startsWith('PARA LOS')||up==='ADICIONALES'||up.startsWith('TOTAL'))continue;
       const rec={articulo:desc,unidad:unit,cantidad:qty,rubro,solapa:sn,archivo:fileName,tipo:'adicional'};
       if(mode==='replace')repl.push(rec);else add.push(rec);
     }else{
       if(/^\d+(?:[.,]\d+)+\s/.test(desc))continue;
       if(up.startsWith('HOJA ')||up.startsWith('TOTAL'))continue;
       if(['VIATICOS','ESTADIA','COMBUSTIBLE','VIANDA','ROPA','SEGURIDAD E HIGIENE'].includes(up))continue;
       if((up.startsWith('EDIFICIO ')||up.startsWith('SALA DE ')||up.startsWith('LOS 4 PABELLONES'))&&qty<=1)continue;
       base.push({articulo:desc,unidad:unit,cantidad:qty,rubro,solapa:sn,archivo:fileName,tipo:'base'});
     }
   }
 });
 return {base,add,repl};
}
async function readXlsxFile(file,rubro){
 const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array',cellDates:false});
 return extractXlsxRecords(wb,rubro,file.name);
}
async function importComputos(obraId){
 const inp=document.getElementById('compFiles');if(!inp||!inp.files.length)return alert('Seleccioná al menos un archivo Excel.');
 const files=[...inp.files],rubros=files.map((f,i)=>document.getElementById('compRubro'+i)?.value||'');
 if(rubros.some(x=>!x))return alert('Elegí el rubro de cada archivo.');
 const o=db.obras.find(x=>x.id===obraId);if(!o)return;
 try{
   const parsed=[];
   for(let i=0;i<files.length;i++)parsed.push(await readXlsxFile(files[i],rubros[i]));
   const all=[...parsed.flatMap(x=>x.base),...parsed.flatMap(x=>x.add)];
   const repl=parsed.flatMap(x=>x.repl);
   const map=new Map();
   all.forEach(r=>{
     const key=normalizeImportMaterial(r.articulo)+'||'+normalizeImportMaterial(r.unidad);
     if(!map.has(key))map.set(key,{id:uid('cmp'),articulo:r.articulo,unidad:r.unidad,cantidadBase:0,cantidadAdicional:0,cantidadComputada:0,fuentes:[]});
     const m=map.get(key);
     if(r.tipo==='base')m.cantidadBase+=r.cantidad;else m.cantidadAdicional+=r.cantidad;
     m.fuentes.push({rubro:r.rubro,solapa:r.solapa,archivo:r.archivo,cantidad:r.cantidad,tipo:r.tipo,unidad:r.unidad});
     m.cantidadComputada=m.cantidadBase+m.cantidadAdicional;
   });
   o.computo={importadoEn:new Date().toISOString(),rubros:[...new Set(rubros)],archivos:files.map((f,i)=>({nombre:f.name,rubro:rubros[i]})),materiales:[...map.values()],reemplazos:repl};
   save();openObraDetail(obraId);
   alert(`Cómputo importado correctamente. ${map.size} materiales consolidados.`);
 }catch(err){console.error(err);alert('No se pudo leer alguno de los Excel. Verificá que sean archivos .xlsx válidos.');}
}

function openOrderModal(preObra=''){
 if(!db.obras.length){alert('Primero creá una obra.');showView('obras');return}
 const obraOptions=db.obras.map(o=>`<option value="${o.id}" ${o.id===preObra?'selected':''}>${esc(o.nombre)}</option>`).join('');
 document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><h2>Nuevo pedido</h2><div class="form-grid">
 <div class="field"><label>Obra *</label><select id="ordObra">${obraOptions}</select></div>
 <div class="field"><label>Nº de pedido *</label><input id="ordNum" placeholder="Ej. 125"></div>
 <div class="field"><label>Fecha</label><input id="ordFecha" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
 <div class="field full"><label>Observación</label><input id="ordObs" placeholder="Opcional"></div>
 </div><hr><h3>Artículos</h3><div class="small" style="margin-bottom:10px">Podés cargar uno por uno o pegar una lista completa copiada desde Excel. Si copiás columnas, usa: <b>Artículo → Cantidad → Unidad</b>.</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button class="btn" onclick="openPasteItemsModal()">📋 Pegar lista desde Excel</button><button class="btn" onclick="addItemRow()">＋ Agregar artículo</button></div><div id="itemRows"></div>
 <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveOrder()">Guardar pedido</button></div></div></div>`;
 addItemRow();addItemRow();
}
function openPasteItemsModal(){
 document.getElementById('modalRoot').insertAdjacentHTML('beforeend',`<div class="modal-bg" id="pasteItemsModal" onclick="if(event.target===this)document.getElementById('pasteItemsModal').remove()"><div class="modal" style="max-width:760px"><h2>📋 Pegar lista de artículos</h2><div class="small" style="margin-bottom:10px">Copiá directamente desde Excel y pegá acá. Cada renglón será un artículo. Si hay columnas, respetá este orden: <b>Artículo | Cantidad | Unidad</b>.</div><textarea id="pasteItemsText" style="width:100%;min-height:220px;resize:vertical" placeholder="Caño galvanizado 1	100	m
Cable 2,5 mm	500	m
Térmica 20A	12	un"></textarea><div class="small" style="margin-top:8px">También podés pegar solamente una columna de artículos: en ese caso se crea un renglón por cada línea.</div><div class="modal-actions"><button class="btn" onclick="document.getElementById('pasteItemsModal').remove()">Cancelar</button><button class="btn primary" onclick="pasteItemsFromText()">Agregar renglones</button></div></div></div>`);
 setTimeout(()=>document.getElementById('pasteItemsText').focus(),50);
}
function pasteItemsFromText(){
 const ta=document.getElementById('pasteItemsText');
 if(!ta)return;
 const lines=ta.value.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);
 if(!lines.length)return alert('Pegá al menos un artículo.');
 const box=document.getElementById('itemRows');
 lines.forEach(line=>{
   const cols=line.split('\t').map(x=>x.trim());
   const id=uid('row');
   const art=cols[0]||'';
   const qty=cols[1]||'';
   const unit=cols[2]||'';
   box.insertAdjacentHTML('beforeend',`<div class="item-box" id="${id}"><div class="item-row">
    <input class="it-art" placeholder="Artículo" value="${esc(art)}">
    <input class="it-qty" type="number" min="0" step="any" placeholder="Cantidad" value="${esc(qty)}">
    <input class="it-unit" placeholder="Unidad" value="${esc(unit)}">
    <select class="it-prov"><option value="">Sin proveedor</option>${db.proveedores.map(p=>`<option>${esc(p.nombre)}</option>`).join('')}</select>
    <input class="it-price" type="number" min="0" step="any" placeholder="Precio inicial">
   </div><div style="margin-top:7px"><button class="link" onclick="document.getElementById('${id}').remove()">Eliminar</button></div></div>`);
 });
 document.getElementById('pasteItemsModal').remove();
}
function addItemRow(){
 const box=document.getElementById('itemRows'),id=uid('row');
 box.insertAdjacentHTML('beforeend',`<div class="item-box" id="${id}"><div class="item-row">
 <input class="it-art" placeholder="Artículo">
 <input class="it-qty" type="number" min="0" step="any" placeholder="Cantidad">
 <input class="it-unit" placeholder="Unidad">
 <select class="it-prov"><option value="">Sin proveedor</option>${db.proveedores.map(p=>`<option>${esc(p.nombre)}</option>`).join('')}</select>
 <input class="it-price" type="number" min="0" step="any" placeholder="Precio inicial">
 </div><div style="margin-top:7px"><button class="link" onclick="document.getElementById('${id}').remove()">Eliminar</button></div></div>`);
}
function saveOrder(){
 const obraId=document.getElementById('ordObra').value,num=document.getElementById('ordNum').value.trim();
 if(!num)return alert('Ingresá el número de pedido.');
 const rows=[...document.querySelectorAll('#itemRows .item-box')].map(r=>({articulo:r.querySelector('.it-art').value.trim(),cantidad:Number(r.querySelector('.it-qty').value||0),unidad:r.querySelector('.it-unit').value.trim(),proveedor:r.querySelector('.it-prov').value,precio:Number(r.querySelector('.it-price').value||0)})).filter(x=>x.articulo);
 if(!rows.length)return alert('Agregá al menos un artículo.');
 const pid=uid('ped');db.pedidos.push({id:pid,obraId,numero:num,fecha:document.getElementById('ordFecha').value,obs:document.getElementById('ordObs').value.trim()});
 rows.forEach(x=>db.items.push({...x,id:uid('item'),pedidoId:pid,recibido:0,proveedor:'',precioAceptado:0,estadoCompra:'pendiente',cotizaciones:[]}));
 save();closeModal();render();openOrderDetail(pid);
}

function openQuotesModal(itemId){
 const i=db.items.find(x=>x.id===itemId);
 if(!i)return;
 i.cotizaciones=i.cotizaciones||[];
 const rows=i.cotizaciones.map((q,idx)=>`
   <div class="quote">
    <div class="quote-grid">
      <div class="field"><label>Proveedor</label><input value="${esc(q.proveedor||'')}" onchange="updateQuote('${itemId}',${idx},'proveedor',this.value)"></div>
      <div class="field"><label>Precio</label><input type="number" value="${q.precio||''}" onchange="updateQuote('${itemId}',${idx},'precio',this.value)"></div>
      <div class="field"><label>Estado</label><select onchange="updateQuote('${itemId}',${idx},'estado',this.value)">
        <option value="pendiente" ${q.estado==='pendiente'?'selected':''}>Pendiente</option>
        <option value="aceptada" ${q.estado==='aceptada'?'selected':''}>Aceptada</option>
        <option value="rechazada" ${q.estado==='rechazada'?'selected':''}>Rechazada</option>
      </select></div>
      <button class="btn" onclick="removeQuote('${itemId}',${idx})">Eliminar</button>
    </div>
   </div>`).join('');
 document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
 <div class="detail-head"><div><h2>💰 Cotizaciones — ${esc(i.articulo)}</h2><div class="small">Pedido: ${esc((db.pedidos.find(p=>p.id===i.pedidoId)||{}).numero||'')}</div></div><button class="btn" onclick="closeModal();openOrderDetail('${i.pedidoId}')">Cerrar</button></div>
 <hr>
 <div id="quotesList">${rows || '<div class="empty">Todavía no cargaste cotizaciones.</div>'}</div>
 <button class="btn" onclick="addQuote('${itemId}')">＋ Agregar proveedor / precio</button>
 <div class="modal-actions"><button class="btn primary" onclick="saveQuotes('${itemId}')">Guardar cotizaciones</button></div>
 </div></div>`;
}
function addQuote(itemId){
 const i=db.items.find(x=>x.id===itemId);i.cotizaciones=i.cotizaciones||[];
 i.cotizaciones.push({id:uid('quote'),proveedor:'',precio:0,estado:'pendiente'});
 openQuotesModal(itemId);
}
function updateQuote(itemId,idx,key,value){
 const i=db.items.find(x=>x.id===itemId);if(!i||!i.cotizaciones[idx])return;
 i.cotizaciones[idx][key]=key==='precio'?Number(value||0):value;
}
function removeQuote(itemId,idx){
 const i=db.items.find(x=>x.id===itemId);if(!i)return;
 i.cotizaciones.splice(idx,1);openQuotesModal(itemId);
}
function saveQuotes(itemId){
 const i=db.items.find(x=>x.id===itemId);if(!i)return;
 i.cotizaciones=(i.cotizaciones||[]).filter(q=>q.proveedor&&Number(q.precio)>=0);
 const accepted=i.cotizaciones.find(q=>q.estado==='aceptada');
 if(accepted){
   i.proveedor=accepted.proveedor;
   i.precioAceptado=Number(accepted.precio||0);
   i.estadoCompra='aceptado';
   i.proveedor=accepted.proveedor;
   i.precioAceptado=Number(accepted.precio||0);
   i.cotizaciones.forEach(q=>{if(q!==accepted)q.estado='rechazada';});
 }else if(i.cotizaciones.some(q=>q.estado==='rechazada')){
   i.estadoCompra='pendiente';
 }
 save();closeModal();openOrderDetail(i.pedidoId);
}

function getDocs(){
 return db.documents||(db.documents=[]);
}
function formatBytes(bytes){
 if(!bytes)return '';
 if(bytes<1024)return bytes+' B';
 if(bytes<1024*1024)return (bytes/1024).toFixed(1)+' KB';
 return (bytes/1024/1024).toFixed(1)+' MB';
}
function openDocumentsModal(type,id){
 const docs=getDocs().filter(d=>d.type===type&&d.ownerId===id);
 const title=type==='pedido'?'Documentación del pedido':'Documentación del artículo';
 document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
 <div class="detail-head"><div><h2>📎 ${title}</h2><div class="small">PDF, imágenes, Excel, Word y otros archivos</div></div><button class="btn" onclick="closeModal()">Cerrar</button></div>
 <hr>
 <div>${docs.length?docs.map(d=>`<div class="doc"><div><div class="doc-name">📄 ${esc(d.name)}</div><div class="doc-meta">${esc(d.category||'Documento')} · ${esc(d.date||'')} · ${formatBytes(d.size)}</div></div><div class="actions"><button class="link" onclick="openDocument('${d.id}')">Abrir</button><button class="link" onclick="deleteDocument('${d.id}','${type}','${id}')">Eliminar</button></div></div>`).join(''):'<div class="empty">No hay documentos adjuntos.</div>'}</div>
 <hr>
 <div class="form-grid">
  <div class="field"><label>Tipo de documento</label><select id="docCategory"><option>Remito</option><option>Ficha técnica</option><option>Presupuesto</option><option>Certificado</option><option>Orden de compra</option><option>Otro</option></select></div>
  <div class="field"><label>Archivo</label><input id="docFile" type="file"></div>
 </div>
 <div class="modal-actions"><button class="btn primary" onclick="saveDocument('${type}','${id}')">＋ Adjuntar archivo</button></div>
 </div></div>`;
}
function saveDocument(type,id){
 const input=document.getElementById('docFile'),file=input.files[0];
 if(!file)return alert('Seleccioná un archivo.');
 // Files are stored as base64 in local browser storage for this prototype.
 const reader=new FileReader();
 reader.onload=()=>{
   getDocs().push({id:uid('doc'),type,ownerId:id,name:file.name,size:file.size,mime:file.type,data:reader.result,category:document.getElementById('docCategory').value,date:new Date().toLocaleDateString('es-AR')});
   save();openDocumentsModal(type,id);
 };
 reader.readAsDataURL(file);
}
function openDocument(id){
 const d=getDocs().find(x=>x.id===id);if(!d)return;
 const w=window.open();
 if(!w)return alert('El navegador bloqueó la ventana. Permití ventanas emergentes para este archivo.');
 if(d.mime==='application/pdf'||(d.mime||'').startsWith('image/')){
   w.document.write(`<title>${esc(d.name)}</title><iframe src="${d.data}" style="border:0;width:100vw;height:100vh"></iframe>`);
 }else{
   const a=w.document.createElement('a');a.href=d.data;a.download=d.name;a.textContent='Abrir / descargar '+d.name;a.style.fontSize='20px';w.document.body.appendChild(a);
 }
}
function deleteDocument(docId,type,id){
 if(!confirm('¿Eliminar este documento?'))return;
 db.documents=getDocs().filter(d=>d.id!==docId);save();openDocumentsModal(type,id);
}
function openDeliveryModal(itemId){
 const i=db.items.find(x=>x.id===itemId),f=Math.max(0,Number(i.cantidad)-Number(i.recibido||0));
 if(i.estadoCompra!=='aceptado'){alert('Primero tenés que aceptar una cotización para este artículo.');openQuotesModal(itemId);return;}
 document.getElementById('modalRoot').innerHTML=`<div class="modal-bg"><div class="modal"><h2>Registrar entrega / retiro</h2><p><b>${esc(i.articulo)}</b><br><span class="small">Comprado: ${i.cantidad} ${esc(i.unidad||'')} · Ya recibido: ${i.recibido||0} · Falta: ${f}</span></p>
 <div class="form-grid"><div class="field"><label>Cantidad recibida / retirada *</label><input id="delQty" type="number" min="0" max="${f}" step="any" value="${f}"></div><div class="field"><label>Fecha</label><input id="delDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field full"><label>Nota</label><input id="delNote" placeholder="Ej. Retiró Juan / entrega parcial"></div><div class="field full"><label>📎 Remito (opcional)</label><input id="delFile" type="file"></div></div>
 <div class="modal-actions"><button class="btn" onclick="closeModal();openOrderDetail('${i.pedidoId}')">Cancelar</button><button class="btn primary" onclick="saveDelivery('${itemId}')">Registrar</button></div></div></div>`;
}
function saveDelivery(itemId){
 const i=db.items.find(x=>x.id===itemId),f=Math.max(0,Number(i.cantidad)-Number(i.recibido||0)),q=Number(document.getElementById('delQty').value||0);
 if(q<=0||q>f)return alert('La cantidad debe ser mayor a 0 y no superar lo pendiente.');
 const file=document.getElementById('delFile').files[0];
 const finish=(fileData=null,fileMeta=null)=>{
   i.recibido=Number(i.recibido||0)+q;
   i.entregas=i.entregas||[];
   const entrega={cantidad:q,fecha:document.getElementById('delDate').value,nota:document.getElementById('delNote').value.trim()};
   if(fileData){
     const doc={id:uid('doc'),type:'item',ownerId:itemId,name:file.name,size:file.size,mime:file.type,data:fileData,category:'Remito',date:document.getElementById('delDate').value};
     getDocs().push(doc);entrega.documentoId=doc.id;
   }
   i.entregas.push(entrega);save();closeModal();openOrderDetail(i.pedidoId);
 };
 if(file){const r=new FileReader();r.onload=()=>finish(r.result,{name:file.name});r.readAsDataURL(file)}else finish();
}
function exportData(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='compras-backup.json';a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
 const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.obras||!x.pedidos||!x.items)throw 0;db=x;save();render();alert('Datos importados correctamente.')}catch{alert('El archivo no tiene un formato válido.')}};r.readAsText(file);e.target.value='';
}
render();
</script>
</body>
</html>
